name: Deploy frontend to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sestaveni s tajnym klicem
        run: |
          mkdir -p build/frontend
          cp -r frontend/. build/frontend/
          sed -i "s|__FUNCTION_KEY__|${{ secrets.FUNCTION_KEY }}|g" build/frontend/app.js

      - name: Upload artefaktu pro Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

      - name: Nasazeni na GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
